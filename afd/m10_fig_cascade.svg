<svg class="setupfig" viewBox="0 0 720 400" width="100%" role="img" aria-label="A log-log plot of the energy spectrum E of k against wavenumber k times the outer scale L. A straight line of slope minus five thirds runs across four decades of wavenumber, from the stirring scale on the left to the dissipation scale on the right, where an exponential cut-off bends it sharply downward. A dashed line of slope minus two starts at the same point on the left and falls below the first line, ending about twenty-one times lower after four decades. Vertical dashed lines mark the stirring scale and the dissipation scale, and the band between them is shaded and labelled the inertial range." >
