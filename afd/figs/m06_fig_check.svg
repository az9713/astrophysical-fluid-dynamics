<svg class="setupfig" viewBox="0 0 760 590" width="100%" role="img" aria-label="Upper panel: on a logarithmic pressure axis, the two-phase window predicted by Wolfire and collaborators from 1960 to 4810 with its geometric mean 3070, the window from the analytic cooling fit from 1597 to 5007, and the measured cold-gas pressure of Jenkins and Tripp at 3802 with a spread of 0.175 dex. The measurement lies inside both windows. Lower panel: the fraction of cold gas below the minimum pressure. A static two-phase medium allows none, the fitted lognormal gives 5 per cent, and the measurement gives 29 per cent for all sight lines and 23 per cent for the low-starlight subsample.">
