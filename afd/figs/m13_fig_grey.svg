<svg class="setupfig" viewBox="0 0 720 520" width="100%" role="img" aria-label="Two stacked panels against Rosseland optical depth from 0.01 to 3 on a logarithmic axis. The upper panel shows temperature from the ATLAS9 solar model and from the grey Eddington atmosphere; the two curves cross near 0.05 and the grey curve lies below the model deeper in. The lower panel shows the grey temperature divided by the model temperature minus one, in per cent, inside a shaded band of plus and minus 3.1 per cent; the largest excursion is plus 3.0 per cent at the top." >
