<svg class="setupfig" viewBox="0 0 760 366" width="100%" role="img" aria-label="Four Rayleigh-Taylor mixing widths drawn on one radial axis from 0.74 to 1.04 in units of the blast-wave radius, every one starting at the one-dimensional contact discontinuity at 0.77. The width predicted by the plane-interface mixing law is 0.73 per cent of the blast-wave radius and is a hairline. The two-dimensional simulation gives 8 per cent, Tycho's mean contact discontinuity 16 per cent and its farthest clumps 23 per cent.">
<text x="485.0" y="28.0" font-size="12.5" text-anchor="middle" fill="#cbd5e1">Rayleigh–Taylor at Tycho: one predicted width against three observed ones</text>
<rect x="250" y="52" width="470" height="184" fill="none" stroke="#334155" stroke-width="1"/>
<line x1="297.0" y1="236" x2="297.0" y2="241" stroke="#334155" stroke-width="1"/>
<text x="297.0" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.77</text>
<line x1="344.0" y1="236" x2="344.0" y2="241" stroke="#334155" stroke-width="1"/>
<text x="344.0" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.80</text>
<line x1="422.3" y1="236" x2="422.3" y2="241" stroke="#334155" stroke-width="1"/>
<text x="422.3" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.85</text>
<line x1="500.7" y1="236" x2="500.7" y2="241" stroke="#334155" stroke-width="1"/>
<text x="500.7" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.90</text>
<line x1="579.0" y1="236" x2="579.0" y2="241" stroke="#334155" stroke-width="1"/>
<text x="579.0" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.95</text>
<line x1="657.3" y1="236" x2="657.3" y2="241" stroke="#334155" stroke-width="1"/>
<text x="657.3" y="254" font-size="10.5" text-anchor="middle" fill="#94a3b8">1.00</text>
<text x="485.0" y="272.0" font-size="11.5" text-anchor="middle" fill="#cbd5e1">radius ÷ blast-wave radius</text>
<line x1="657.3" y1="52" x2="657.3" y2="236" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
<text x="651.3" y="65.0" font-size="10.5" text-anchor="end" fill="#94a3b8">blast wave</text>
<line x1="297.0" y1="52" x2="297.0" y2="236" stroke="#a78bfa" stroke-width="1.2"/>
<text x="303.0" y="65.0" font-size="10.5" text-anchor="start" fill="#a78bfa">1-D contact discontinuity</text>
<line x1="250" y1="75.0" x2="720" y2="75.0" stroke="#334155" stroke-width="0.6"/>
<text x="238.0" y="73.0" font-size="10.5" text-anchor="end" fill="#2dd4bf">predicted by Module 7's mixing law</text>
<text x="238.0" y="87.0" font-size="10.5" text-anchor="end" fill="#94a3b8">h = α<tspan baseline-shift="sub" font-size="8">B</tspan> A m(1−m) R, A = 1</text>
<rect x="297.0" y="70.5" width="11.4" height="9" fill="#2dd4bf" stroke='#2dd4bf' stroke-width='1'/>
<line x1="308.4" y1="67.5" x2="383.2" y2="57.5" stroke="#2dd4bf" stroke-width="1"/>
<text x="387.9" y="59.5" font-size="10.5" text-anchor="start" fill="#2dd4bf">0.73% of R (≤0.88% at α<tspan baseline-shift="sub" font-size="8">B</tspan>+1σ)</text>
<line x1="250" y1="121.0" x2="720" y2="121.0" stroke="#334155" stroke-width="0.6"/>
<text x="238.0" y="119.0" font-size="10.5" text-anchor="end" fill="#fb923c">2-D simulation, pure hydro</text>
<text x="238.0" y="133.0" font-size="10.5" text-anchor="end" fill="#94a3b8">Wang &amp; Chevalier (2001)</text>
<rect x="297.0" y="116.5" width="125.3" height="9" fill="#fb923c" />
<text x="431.3" y="125.0" font-size="10.5" text-anchor="start" fill="#fb923c">8%</text>
<line x1="250" y1="167.0" x2="720" y2="167.0" stroke="#334155" stroke-width="0.6"/>
<text x="238.0" y="165.0" font-size="10.5" text-anchor="end" fill="#fb923c">Tycho, mean CD, deprojected</text>
<text x="238.0" y="179.0" font-size="10.5" text-anchor="end" fill="#94a3b8">Warren et al. (2005)</text>
<rect x="297.0" y="162.5" width="250.7" height="9" fill="#fb923c" />
<text x="556.7" y="171.0" font-size="10.5" text-anchor="start" fill="#fb923c">16%</text>
<line x1="250" y1="213.0" x2="720" y2="213.0" stroke="#334155" stroke-width="0.6"/>
<text x="238.0" y="211.0" font-size="10.5" text-anchor="end" fill="#fb923c">Tycho, farthest ejecta clumps</text>
<text x="238.0" y="225.0" font-size="10.5" text-anchor="end" fill="#94a3b8">Warren et al. (2005), sect. 3</text>
<rect x="297.0" y="208.5" width="360.3" height="9" fill="#fb923c" />
<text x="666.3" y="217.0" font-size="10.5" text-anchor="start" fill="#fb923c">23%</text>
<text x="20.0" y="304.0" font-size="10.5" text-anchor="start" fill="#94a3b8">Predicted ÷ simulated = 0.091. α<tspan baseline-shift="sub" font-size="8">B</tspan> = 0.038 ± 0.008 is the BUBBLE coefficient; the observed</text>
<text x="20.0" y="320.0" font-size="10.5" text-anchor="start" fill="#94a3b8">quantity is a spike penetration, so the prediction is a lower bound. A ≤ 1 and m(1−m) ≤ ¼ are hard bounds, so no</text>
<text x="20.0" y="336.0" font-size="10.5" text-anchor="start" fill="#94a3b8">choice of Atwood number or expansion index closes the gap. Warren et al. read the 0.93 as evidence of</text>
<text x="20.0" y="352.0" font-size="10.5" text-anchor="start" fill="#94a3b8">cosmic-ray compression at the blast wave, not of mixing at the contact discontinuity.</text>
</svg>