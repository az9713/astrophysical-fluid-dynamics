<text x="318.0" y="251.8" font-size="10.5" text-anchor="end" fill="#94a3b8">TS-2 ρ₂/ρ₁ / gas-dynamic 3.56</text>
<line x1="611.6" y1="239.8" x2="624.7" y2="239.8" stroke="#94a3b8" stroke-width="2"/>
<circle cx="618.3" cy="239.8" r="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/>
<text x="636.7" y="233.8" font-size="10.5" text-anchor="start" fill="#94a3b8">0.67</text>
<text x="334.4" y="98.6" font-size="10.5" text-anchor="start" fill="#fb923c">CONFIRMED</text>
<text x="334.4" y="187.4" font-size="10.5" text-anchor="start" fill="#2dd4bf">REFUTED</text>
<text x="334.4" y="217.8" font-size="10.5" text-anchor="start" fill="#94a3b8">not used:</text>
<text x="334.4" y="231.8" font-size="10.5" text-anchor="start" fill="#94a3b8">partly circular</text>
<text x="20.0" y="322.0" font-size="10.5" text-anchor="start" fill="#94a3b8">Richardson et al. (2008), Nature 454, 63–66. Neptune values read from their Figure 5 caption, which gives no uncertainty; T values from p. 65.</text>
<text x="20.0" y="338.0" font-size="10.5" text-anchor="start" fill="#94a3b8">Grey row: compression ratio and Mach number come from one Rankine–Hugoniot fit (their Table 1), so it tests the fit.</text>
</svg>