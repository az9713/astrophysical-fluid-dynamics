<svg class="setupfig" viewBox="0 0 760 350" width="100%" role="img" aria-label="Measured value divided by the Rankine-Hugoniot prediction, on a logarithmic axis from 0.05 to 2, for five comparisons from Voyager 2. Three comparisons at Neptune's bow shock sit at 1. The termination-shock temperature sits at 0.1. A fifth, grey, termination-shock compression ratio sits at 0.67 and is marked as partly circular.">
<text x="535.0" y="22.0" font-size="12.5" text-anchor="middle" fill="#cbd5e1">Voyager 2: measured ÷ Rankine–Hugoniot prediction</text>
<rect x="330" y="40" width="410" height="222" fill="none" stroke="#334155" stroke-width="1"/>
<line x1="330.0" y1="262" x2="330.0" y2="267" stroke="#334155" stroke-width="1"/>
<text x="330.0" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.05</text>
<line x1="407.0" y1="262" x2="407.0" y2="267" stroke="#334155" stroke-width="1"/>
<text x="407.0" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.1</text>
<line x1="484.1" y1="262" x2="484.1" y2="267" stroke="#334155" stroke-width="1"/>
<text x="484.1" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.2</text>
<line x1="585.9" y1="262" x2="585.9" y2="267" stroke="#334155" stroke-width="1"/>
<text x="585.9" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">0.5</text>
<line x1="663.0" y1="262" x2="663.0" y2="267" stroke="#334155" stroke-width="1"/>
<text x="663.0" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">1</text>
<line x1="740.0" y1="262" x2="740.0" y2="267" stroke="#334155" stroke-width="1"/>
<text x="740.0" y="280" font-size="10.5" text-anchor="middle" fill="#94a3b8">2</text>
<text x="535.0" y="298.0" font-size="11.5" text-anchor="middle" fill="#cbd5e1">ratio, logarithmic</text>
<line x1="663.0" y1="40" x2="663.0" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="330" y1="62.2" x2="740" y2="62.2" stroke="#334155" stroke-width="0.6"/>
<text x="318.0" y="60.2" font-size="10.5" text-anchor="end" fill="#fb923c">Neptune bow shock</text>
<text x="318.0" y="74.2" font-size="10.5" text-anchor="end" fill="#94a3b8">density jump / 4</text>
<circle cx="663.0" cy="62.2" r="5" fill="#fb923c"/>
<text x="651.0" y="56.2" font-size="10.5" text-anchor="end" fill="#fb923c">1.00</text>
<line x1="330" y1="106.6" x2="740" y2="106.6" stroke="#334155" stroke-width="0.6"/>
<text x="318.0" y="104.6" font-size="10.5" text-anchor="end" fill="#fb923c">Neptune bow shock</text>
<text x="318.0" y="118.6" font-size="10.5" text-anchor="end" fill="#94a3b8">speed drop / 4</text>
<circle cx="663.0" cy="106.6" r="5" fill="#fb923c"/>
<text x="651.0" y="100.6" font-size="10.5" text-anchor="end" fill="#fb923c">1.00</text>
<line x1="330" y1="151.0" x2="740" y2="151.0" stroke="#334155" stroke-width="0.6"/>
<text x="318.0" y="149.0" font-size="10.5" text-anchor="end" fill="#fb923c">Neptune bow shock</text>
<text x="318.0" y="163.0" font-size="10.5" text-anchor="end" fill="#94a3b8">ρ₂/ρ₁ from T-jump Mach 17.8 / 4</text>
<circle cx="661.9" cy="151.0" r="5" fill="#fb923c"/>
<text x="649.9" y="145.0" font-size="10.5" text-anchor="end" fill="#fb923c">0.99</text>
<line x1="330" y1="195.4" x2="740" y2="195.4" stroke="#334155" stroke-width="0.6"/>
<text x="318.0" y="193.4" font-size="10.5" text-anchor="end" fill="#2dd4bf">termination shock</text>
<text x="318.0" y="207.4" font-size="10.5" text-anchor="end" fill="#94a3b8">T observed / T predicted</text>
<circle cx="407.0" cy="195.4" r="5" fill="#2dd4bf"/>
<text x="419.0" y="189.4" font-size="10.5" text-anchor="start" fill="#2dd4bf">0.10</text>
