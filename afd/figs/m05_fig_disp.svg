<svg class="setupfig" viewBox="0 0 760 380" width="100%" role="img" aria-label="Left panel: the square of the frequency against the square of the wavenumber for a uniform self-gravitating medium. It is a straight line of slope the sound speed squared, crossing zero at the Jeans wavenumber, and the region below zero is shaded as unstable. Right panel: the growth rate below the Jeans wavenumber and the wave frequency above it, both divided by the square root of four pi G rho. The growth rate rises to a plateau of one as the wavenumber goes to zero, and the free-fall rate is drawn as a second horizontal line about half as high.">
