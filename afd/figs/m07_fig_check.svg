<svg class="setupfig" viewBox="0 0 760 576" width="100%" role="img" aria-label="Upper panel: the measured Rayleigh-Taylor mixing constant alpha B, drawn with its error bar on an axis marked in units of that error bar. Three candidate values are marked. The two ends of the factor-of-two discrepancy this measurement was meant to close, 0.025 and 0.05, both lie within two sigma of it, so it closes neither. Lower panel: the observed vortex propagation speed band, from six to fourteen kilometres per second, with two predictions drawn on it. Both fall inside the band, so the observation cannot separate them.">
