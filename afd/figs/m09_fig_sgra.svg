<svg class="setupfig" viewBox="0 0 760 316" width="100%" role="img" aria-label="A logarithmic axis of accretion rate onto Sagittarius A star in solar masses per year, from ten to the minus nine and a half to ten to the minus four and a half. Six rungs. The two highest are the Bondi rate computed from the measured gas density and temperature, at eight times ten to the minus six and three times ten to the minus six. Below them, four limits from Faraday rotation: two upper limits at two times ten to the minus seven and five times ten to the minus eight, and two lower limits, each given by its source as a range: one to two times ten to the minus eight, and two to four times ten to the minus nine. The gap between the Bondi rate and the highest upper limit is a factor of forty, but that upper limit assumes a magnetic field near equipartition strength; at three per cent of equipartition the same rotation measure allows a rate ten times higher and the gap is a factor of four. The two lower limits carry no such condition.">
