<svg class="setupfig" viewBox="0 0 720 330" width="100%" role="img" aria-label="One logarithmic axis of luminosity over the Eddington luminosity, from ten to the minus thirteen to ten to the five. A vertical line marks 1, the limit. Filled circles mark two measured luminosities, Sagittarius A star at 3.7 times ten to the minus twelve and the Sun at 2.7 times ten to the minus five. Open diamonds mark two accretion rates read as luminosities at efficiency 0.1: the Module 11 disc at 0.1 and the Module 9 Bondi hole at 3664, above the limit." >
