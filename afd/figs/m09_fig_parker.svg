<svg class="setupfig" viewBox="0 0 760 602" width="100%" role="img" aria-label="Upper panel: the speed of the isothermal Parker wind against heliocentric distance on a logarithmic axis, for coronal temperatures of one, one and a half, and two million kelvin, with the sonic point marked on each and the Helios measurement range from 0.29 to 0.98 astronomical units shaded. Lower panel: the logarithmic slope of velocity against radius over that same range, predicted five different ways, each with its own bar, against the measured value of 0.049 plus or minus 0.010, which is drawn both as a sixth bar and as a vertical band. Every prediction misses the band, the isothermal ones from above and the momentum-equation one from below.">
