<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TITLE — Astrophysical Fluid Dynamics</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']], tags: 'ams' },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js" async></script>
<style>
  :root{
    --bg:#0f172a; --box:#1e293b; --fg:#e2e8f0; --fg2:#cbd5e1;
    --muted:#94a3b8; --accent:#fb923c; --accent2:#2dd4bf;
    --rule:#334155; --rule2:#1e293b;
  }
  html{ -webkit-text-size-adjust:100%; background:var(--bg); }
  body{ max-width: 52rem; margin: 2.5rem auto; padding: 0 1.25rem 6rem;
        font: 16px/1.7 Georgia, 'Times New Roman', serif; color:var(--fg);
        background:var(--bg); counter-reset: fig; }
  h1{ font-size: 1.9rem; line-height:1.2; margin:.2rem 0 .2rem; color:#f8fafc; }
  h2{ font-size:1.35rem; margin:2.6rem 0 .6rem; border-bottom:2px solid var(--accent);
      padding-bottom:.2rem; color:#f8fafc; }
  h3{ font-size:1.08rem; margin:1.7rem 0 .4rem; color:var(--accent); }
  h4{ font-size:1rem; margin:1.2rem 0 .3rem; color:var(--accent2); }
  .sub{ color:var(--muted); font-style:italic; margin-top:0; }
  a{ color:var(--accent2); }
  code{ font-family: ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:.92em;
        background:#111c33; color:#e2e8f0; padding:.05rem .28rem; border-radius:3px;
        border:1px solid var(--rule2); }
  pre{ background:#0b1324; border:1px solid var(--rule); padding:.8rem 1rem; border-radius:5px;
       overflow:auto; font-size:.84rem; line-height:1.45; color:#e2e8f0; }
  pre code{ background:none; padding:0; border:none; }
  .codewrap{ position:relative; }
  .copybtn{ position:absolute; top:.5rem; right:.5rem; display:inline-flex; align-items:center; gap:.3rem;
    font:600 .72rem/1 ui-monospace,Consolas,monospace; color:var(--muted);
    background:var(--box); border:1px solid var(--rule); border-radius:5px; padding:.32rem .5rem; cursor:pointer; }
  .copybtn:hover{ color:var(--accent); border-color:var(--accent); }
  .copybtn.copied{ color:var(--accent2); border-color:var(--accent2); }
  .copybtn svg{ width:13px; height:13px; }
  .thm,.def,.lem,.prop{ background:var(--box); border-left:4px solid var(--accent);
      padding:.6rem .9rem; margin:1rem 0; border-radius:0 4px 4px 0; }
  .def{ border-left-color:var(--accent2); }
  .thm b,.lem b,.prop b{ color:var(--accent); }
  .def b{ color:var(--accent2); }
  .proof{ border-left:2px solid var(--rule); padding-left:.9rem; margin:.8rem 0 1.2rem; color:var(--fg2); }
  .proof::before{ content:"Proof."; font-style:italic; font-weight:bold; margin-right:.4rem; color:var(--muted); }
  .qed{ float:right; color:var(--accent); }
  table{ border-collapse:collapse; width:100%; margin:1rem 0; font-size:.95rem; }
  th,td{ border:1px solid var(--rule); padding:.45rem .6rem; text-align:left; vertical-align:top; }
  th{ background:var(--box); color:#f8fafc; }
  figure{ margin:1.6rem 0; text-align:center; counter-increment: fig; }
  figcaption{ color:var(--muted); font-size:.9rem; font-style:italic; margin-top:.4rem; text-align:left; }
  figcaption::before{ content:"Fig. " counter(fig) ". "; font-weight:bold; font-style:normal; color:var(--accent); }
  .proof figure,.thm figure,.lem figure,.prop figure{ margin:.2rem auto .7rem; max-width:460px;
      background:var(--bg); border:1px solid var(--rule); border-radius:5px; padding:.4rem; }
  .proof figcaption,.thm figcaption,.lem figcaption,.prop figcaption{ font-size:.8rem; line-height:1.45; }
  .setupfig{ display:block; }
  /* dark halo behind in-plot labels so curves under text stay legible */
  .setupfig text{ paint-order:stroke; stroke:#0f172a; stroke-width:3px; stroke-linejoin:round; }
  .setupfig text.onfill{ stroke:none; }
  figure svg text{ font-family:"STIX Two Math",STIXGeneral,"Times New Roman",Georgia,serif; fill:#cbd5e1; }
  figure svg text.v{ font-style:italic; }
  figure svg text.vb{ font-weight:bold; }
  .secref{ color:var(--accent); text-decoration:none; border-bottom:1px dotted #9a6a3a; }
  .secref:hover{ border-bottom:1px solid var(--accent); }
  .toc{ background:var(--box); padding:.8rem 1.2rem; border-radius:6px; font-size:.95rem; border:1px solid var(--rule); }
  .toc ul{ list-style:none; padding-left:.3rem; margin:.3rem 0; }
  .toc a{ color:var(--accent2); text-decoration:none; }
  .toc a:hover{ text-decoration:underline; }
  .small{ font-size:.88rem; color:var(--muted); }
  hr{ border:none; border-top:1px solid var(--rule); margin:2.5rem 0; }
  .keyresult{ background:#2a2410; border:1px solid #6b5a1f; padding:.5rem .9rem; border-radius:4px; color:#fde68a; }
  .prov{ display:block; border-left:3px solid #c08a00; padding:.15rem .7rem;
         margin:.5rem 0; font-size:.94em; color:var(--muted); }
  .prov::before{ content:"provenance — "; font-variant:small-caps; letter-spacing:.04em; color:#d4a017; }
  .warn{ display:block; border-left:3px solid #f87171; background:#2a1414; padding:.4rem .8rem;
         margin:.8rem 0; font-size:.95em; color:#fecaca; border-radius:0 4px 4px 0; }
  .prob{ background:var(--box); border:1px solid var(--rule); border-radius:5px;
         padding:.6rem .9rem; margin:.9rem 0; }
  .prob b{ color:var(--accent); }
  details.sol{ margin-top:.5rem; }
  details.sol summary{ cursor:pointer; color:var(--accent2); font-size:.9rem; }
  details.sol > div{ border-top:1px solid var(--rule); margin-top:.5rem; padding-top:.5rem; color:var(--fg2); }
  mjx-container[jax="SVG"] > svg { color: var(--fg); }
  .navbar{ font-size:.9rem; color:var(--muted); margin:.6rem 0 0; }
  .navbar a{ color:var(--accent2); text-decoration:none; }
</style>
</head>
<body>

<h1>TITLE</h1>
<p class="sub">SUBTITLE</p>

<div class="toc">
<b>Contents</b>
<ul>
<li><b>1.</b> <a href="#s1">Section</a></li>
</ul>
</div>

<hr>

<script>
function copyCode(btn){
  var code = btn.parentElement.querySelector('code');
  if(!code) return;
  var text = code.textContent;
  var done = function(){
    var label = btn.querySelector('span'), prev = label.textContent;
    btn.classList.add('copied'); label.textContent = 'Copied!';
    setTimeout(function(){ btn.classList.remove('copied'); label.textContent = prev; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}
(function(){
  try{
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.querySelectorAll('svg').forEach(function(svg){
        if(typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
      });
    }
  }catch(e){}
})();
</script>

</body>
</html>
